[colors]
primary = #C34300
background = #000
background-alt = #222
foreground = #C5C8C6
foreground-alt = ${self.primary}
secondary = #8AFF07
alert = #A54242
disabled = #707880

black = #000


[bars]
width = 100%
height = 20pt
radius = 0

bottom = true

; dpi = 96

fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 4px
underline-size = 4px

border-size = 0
border-color = #00000000

padding-left = 2
padding-right = 2

module-margin = 5px

separator =|
separator-foreground = ${colors.disabled}

# font-0 = Cascadia Mono:size=13;2
# font-1 = Cascadia Mono:size=13;0
font-0 = Iosevka Term Extended:style=bold:size=11;2
font-1 = Iosevka Term Extended:style=bold:size=11;0
font-2 = JetBrainsMono Nerd Font:size=11;2
font-3 = Font Awesome 7 Free:size=11;2
font-4 = Iosevka Term Extended:size=14;-1
font-5 = Iosevka Term Extended:style=bold:size=11;-2

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true
# [bar/upper]
# inherit=bars
# module-margin = 8px
# height=20px
# bottom = false
# modules-right = 

[bar/mybar]
monitor = DP-1
inherit = bars
modules-left = i3 
modules-right = mmenu systray pulseaudio xkeyboard date 
modules-center = cmus-ctl cmus-title cmus-timing 


[bar/mybar2]
monitor = HDMI-0
inherit = bars
modules-left = i3 
modules-right = pulseaudio xkeyboard date 
modules-center = cmus-ctl cmus-title cmus-timing 

[module/power_profile]
type = custom/script
exec = ~/.config/polybar/scripts/pmode.sh
tail = true

[module/mmenu]
type = custom/menu

label-open = %{T1}<%{T-}
label-close = %{T1}-%{T-}

format = <menu><label-toggle>

; Optional item separator
; Default: none
label-separator = "%{F#707880} | %{F-}"
format-margin=2px

; If true, <label-toggle> will be to the left of the menu items (default).
; If false, it will be on the right of all the items.
expand-right = false

; "menu-LEVEL-N" has the same properties as "label-NAME" with
; the additional "exec" property
;
; Commands will be executed using "/bin/sh -c $COMMAND"


menu-0-0 = POWR
menu-0-0-exec = menu-open-1

menu-1-0 = LOCK
menu-1-0-exec = betterlockscreen -l
menu-1-1 = REBOOT
menu-1-1-exec = reboot
menu-1-2 = SLEEP
menu-1-2-exec = systemctl suspend && betterlockscreen -l
menu-1-3 = OFF
menu-1-3-exec = poweroff
menu-1-4 = >
menu-1-4-exec = menu-open-0

menu-2-0 = A
menu-2-0-exec =
menu-2-1 = B
menu-2-1-exec =
menu-2-2 = C
menu-2-2-exec = 
menu-2-3 = >
menu-2-3-exec = menu-open-0


