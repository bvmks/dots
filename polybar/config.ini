interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
label-disconnected = %{F#F0C674}%ifname%%{F#707880}: --
format-connected = <label-connected>
format-disconnected = <label-disconnected>

[module/wlan]
