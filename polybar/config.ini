[module/launcher]
type = custom/script
exec = ~/.config/polybar/scripts/launcher.sh
click-left = ~/.config/polybar/scripts/launcher.sh click
interval = 1

[module/test]
# label = %out%
# format = <label>
type = custom/script
exec = ~/.config/polybar/scripts/test.sh
tail = true

[play-pause]

[module/cmus-title]
type = custom/script
exec = ~/.config/polybar/scripts/cmus-title.sh
tail = true
label = %{T1} %output% %{T-}

click-left = cmus-remote -u &
# click-middle = cmus-remote --prev &
# click-right = cmus-remote --next &
scroll-up = cmus-remote -v +10%
scroll-down = cmus-remote -v -10%

[module/cmus-timing]
type = custom/script
exec = ~/.config/polybar/scripts/cmus-timing.sh
tail = true
label = %{T1} %output%%{T-}
label-alt = " bebra"

# scroll-up = cmus-remote -k +1 &
# scroll-down = cmus-remote -k -1 &
# click-left = cmus-remote -k -10 &
# click-right = cmus-remote -k +10 &

[module/cmus-play-pause]
type = custom/script
exec = ~/.config/polybar/scripts/cmus-play-pause.sh
tail = true
label = %{T1}-%output%-%{T-}
click-left = cmus-remote -u &

[module/cmus-ctl]
type = custom/script
exec = ~/.config/polybar/scripts/cmus-ctl.sh
tail=true
label=%output%
# exec = echo "%{A1:termite -e 'htop':} J %{A} %{A1:pavucontrol:} K %{A} %{A1:blueman-manager:} L %{A}"

[module/i3]
type = internal/i3

; Only show workspaces defined on the same output as the bar
;
; Useful if you want to show monitor specific workspaces
; on different bars
;
; Default: false
pin-workspaces = true

; Show urgent workspaces regardless of whether the workspace is actually hidden 
; by pin-workspaces.
;
; Default: false
; New in version 3.6.0
show-urgent = true

; This will split the workspace name on ':'
; Default: false
strip-wsnumbers = true

; Sort the workspaces by index instead of the default
; sorting that groups the workspaces by output
; Default: false
index-sort = true

; Create click handler used to focus workspace
; Default: true
enable-click = true

; Create scroll handlers used to cycle workspaces
; Default: true
enable-scroll = false

; Wrap around when reaching the first/last workspace
; Default: true
wrapping-scroll = false

; Set the scroll cycle direction 
; Default: true
reverse-scroll = false

; Use fuzzy (partial) matching for wc-icon.
; Example: code;♚ will apply the icon to all workspaces 
; containing 'code' in the name
; Changed in version 3.7.0: Selects longest string match instead of the first match.
; Default: false
fuzzy-match = true

; ws-icon-[0-9]+ = <label>;<icon>
; NOTE: The <label> needs to match the name of the i3 workspace
; Neither <label> nor <icon> can contain a semicolon (;)
ws-icon-0 = 1;A
ws-icon-1 = 2;B
ws-icon-2 = 3;C
ws-icon-3 = 4;♝
ws-icon-4 = 5;♞
ws-icon-default = ♟
; NOTE: You cannot skip icons, e.g. to get a ws-icon-6
; you must also define a ws-icon-5.
; NOTE: Icon will be available as the %icon% token inside label-*

; Available tags:
;   <label-state> (default) - gets replaced with <label-(focused|unfocused|visible|urgent)>
;   <label-mode> (default)
format = <label-state> <label-mode>

; Available tokens:
;   %mode%
; Default: %mode%
label-mode = %mode%
label-mode-padding = 1
label-mode-background = #e60053

; Available tokens:
;   %name%
;   %icon%
;   %index%
;   %output%
; Default: %icon% %name%
label-focused = %name%
label-focused-foreground =${colors.primary}
label-focused-background =${colors.background} 
label-focused-underline = ${colors.primary}
label-focused-padding = 1

; Available tokens:
;   %name%
;   %icon%
;   %index%
;   %output%
; Default: %icon% %name%
label-unfocused = %name%
label-unfocused-background =${colors.background} 
label-unfocused-padding = 1

; Available tokens:
;   %name%
;   %icon%
;   %index%
;   %output%
; Default: %icon% %name%
label-visible = %name%
label-visible-underline = #555555
label-visible-padding = 1

; Available tokens:
;   %name%
;   %icon%
;   %index%
;   %output%
; Default: %icon% %name%
label-urgent = %name%
label-urgent-foreground = ${colors.foreground}
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

; Separator in between workspaces
label-separator = |
label-separator-padding = 1
label-separator-foreground = ${colors.disabled}


[module/mpd]
type = internal/mpd

; Host where mpd is running (either ip or domain name)
; Can also be the full path to a unix socket where mpd is running.
host = 127.0.0.1
port = 6600
password = mysecretpassword

; Seconds to sleep between progressbar/song timer sync
; Default: 1
interval = 2
; Available tags:
;   <label-song> (default)
;   <label-time>
;   <bar-progress>
;   <toggle> - gets replaced with <icon-(pause|play)>
;   <toggle-stop> - gets replaced with <icon-(stop|play)>
;   <icon-random>
;   <icon-repeat>
;   <icon-repeatone> (deprecated)
;   <icon-single> - Toggle playing only a single song. Replaces <icon-repeatone>
;   <icon-consume>
;   <icon-prev>
;   <icon-stop>
;   <icon-play>
;   <icon-pause>
;   <icon-next>
;   <icon-seekb>
;   <icon-seekf>
format-online = <icon-prev> <icon-seekb> <icon-stop> <toggle> <icon-seekf> <icon-next>  <icon-repeat> <icon-random>  <bar-progress> <label-time>  <label-song>
;format-playing = ${self.format-online}
;format-paused = ${self.format-online}
;format-stopped = ${self.format-online}

; Available tags:
;   <label-offline>
; Default: ""
;format-offline = <label-offline>

; Available tokens:
;   %artist%
;   %album-artist%
;   %album%
;   %date%
;   %title%
; Default: %artist% - %title%
label-song = 𝄞 %artist% - %title%

; Available tokens:
;   %elapsed%
;   %total%
; Default: %elapsed% / %total%
;label-time = %elapsed% / %total%

; Available tokens:
;   None
label-offline = 🎜 mpd is offline

; Only applies if <icon-X> is used
icon-play = ⏵
icon-pause = ⏸
icon-stop = ⏹
icon-prev = ⏮
icon-next = ⏭
icon-seekb = ⏪
icon-seekf = ⏩
icon-random = 🔀
icon-repeat = 🔁
icon-repeatone = 🔂
icon-single = 🔂
icon-consume = ✀

; Used to display the state of random/repeat/repeatone/single
; Only applies if <icon-[random|repeat|repeatone|single]> is used
toggle-on-foreground = #ff
toggle-off-foreground = #55

; Only applies if <bar-progress> is used
bar-progress-width = 45
bar-progress-indicator = |
bar-progress-fill = ─
bar-progress-empty = ─

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC0
full-at = 100
low-at = 15
poll-interval = 2

label-charging = %percentage:3%%
label-discharging = %percentage:3%%
label-full = %percentage:3%%
label-low = %percentage:3%%

label-charging-foreground = ${colors.foreground}
label-discharging-foreground = ${colors.foreground}
label-low-foreground = #f00

format-charging = "B:<label-charging> %{F#8AFF07}▲%{F-}"
format-discharging = "B:<label-discharging> ▼"
format-full = "B:<label-full> #"
format-low = "B:<label-low> <animation-low>"

animation-charging-0 = %{F#8AFF07}△%{F-}
animation-charging-1 = " "

animation-charging-framerate = 2000

animation-discharging-0 = ▽
animation-discharging-1 = " "

animation-discharging-framerate = 2000

animation-low-0 = %{F#ff0000}!%{F-}
animation-low-1 = " "

animation-low-framerate = 1000

[module/systray]
type = internal/tray
format-margin = 2pt
tray-spacing = 8pt
tray-size = 50%
format=<tray>

[module/xworkspaces]
type = internal/xworkspaces

pin-workspaces = true

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-foreground = ${colors.foreground-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/void]
type=custom/script
exec=echo " "

[module/xwindow]
type = internal/xwindow
label =%title:0:30:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true

label-muted-foreground = ${colors.disabled}
format-volume-prefix-foreground = ${colors.primary}

label-volume = %percentage:3%%
label-muted="V:  0%"

# label-muted   =  MUT  
# ramp-volume-0 = 
# ramp-volume-1 = 
format-volume = "V:<label-volume>"

click-right = pavucontrol &
click-middle = pactl set-sink-volume @DEFAULT_SINK@ 100%










# [module/xkeyboard]
# type = custom/script
# exec = ~/.config/polybar/scripts/kb_layout.sh
# interval = 0.1
# format-prefix = ""

[module/capsind]
type = internal/xkeyboard
blacklist-0 = num lock
# blacklist-1 = caps lock

; Available tags:
;   <label-layout> (default)
;   <label-indicator> (default)
format = <label-indicator>
format-spacing = 0

; Available tokens:
;   %layout%
;   %name%
;   %number%
;   %icon%
;   %variant% (New in version 3.6.0)
; Default: %layout%
# label-layout = %icon%
label-layout-foreground = ${colors.primary}
label-layout-background = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.alert}
label-indicator-background = ${colors.alert}

; layout-icon-[0-9]+ = layout;icon
; layout-icon-[0-9]+ = layout;variant;icon (New in version 3.6.0)
; Assign each layout an icon that will be available as %icon% token for the
; <label-layout> tag.
; In the first configuration form, the `layout` will try to match %layout%
; value ignoring the variant
; In the second configuration form, 
;     the `layout` will try to match %layout% value and the `variant` matches %variant%.
;     the `variant` can be empty (layout;;icon) to match against a %layout%
;                   with an empty %variant%
;     the `variant` can be the wildcard '_' to match a %layout% and any variant. 
;         This is equivalent to the first configuration form
;     the `layout` cannot be empty (;variant;icon)
;     the `layout` can be the wildcard '_' to match any %layout% with a
;                  specific %variant%
;     Do not use the wildcard '_' for both `layout` and `variant`
# layout-icon-0 = ru;RU
# layout-icon-1 = us;EN

; indicator-icon-[0-9]+ = indicator;off icon;on icon
; Provides the content of the %icon% token in label-indicator-*
indicator-icon-0 = caps lock;;CAPS 
indicator-icon-1 = scroll lock;;+SL
indicator-icon-2 = num lock;-NL;+NL

; Replaces label-indicator
; Available tokens:
;   %name%
;   %icon%
; Default: %name%
label-indicator-on = %{F#f00}%icon%%{F-}
; Available tokens:
;   %name%
;   %icon%
; Default: (none)
label-indicator-off = %icon%

; Replaces label-indicator-* if for specific indicators
; Available tokens:
;   %name%
;   %icon%
label-indicator-on-capslock = %icon%
label-indicator-off-capslock = 
label-indicator-on-numlock = 
label-indicator-off-numlock = 
label-indicator-on-scrolllock = 
label-indicator-off-scrolllock = 

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = caps lock

; Available tags:
;   <label-layout> (default)
;   <label-indicator> (default)
format = <label-layout><label-indicator>
format-spacing = 0

; Available tokens:
;   %layout%
;   %name%
;   %number%
;   %icon%
;   %variant% (New in version 3.6.0)
; Default: %layout%
label-layout = %icon%
label-layout-foreground = ${colors.primary}

# label-indicator-padding = 2
# label-indicator-margin = 1
# label-indicator-foreground = ${colors.background}
# label-indicator-background = ${colors.alert}

; Available tokens:
;   %name%
; Default: %name%
; @deprecated, use label-indicator-on
# label-indicator = %icon%

; layout-icon-[0-9]+ = layout;icon
; layout-icon-[0-9]+ = layout;variant;icon (New in version 3.6.0)
; Assign each layout an icon that will be available as %icon% token for the
; <label-layout> tag.
; In the first configuration form, the `layout` will try to match %layout%
; value ignoring the variant
; In the second configuration form, 
;     the `layout` will try to match %layout% value and the `variant` matches %variant%.
;     the `variant` can be empty (layout;;icon) to match against a %layout%
;                   with an empty %variant%
;     the `variant` can be the wildcard '_' to match a %layout% and any variant. 
;         This is equivalent to the first configuration form
;     the `layout` cannot be empty (;variant;icon)
;     the `layout` can be the wildcard '_' to match any %layout% with a
;                  specific %variant%
;     Do not use the wildcard '_' for both `layout` and `variant`
layout-icon-0 = ru;RU
layout-icon-1 = us;EN

