include colors.conf

# font_family      PT Mono
# bold_font        PT Mono Bold
# italic_font      PT Mono Italic
# bold_italic_font PT Mono Bold Italic

font_family      Iosevka Term Extended
bold_font        auto
italic_font      auto
bold_italic_font auto

disable_ligatures always

font_size 11.0

background_opacity 0.9


# map ctrl+shift+enter new_window
# map ctrl+shift+delete close_window
# map ctrl+shift+] next_window
# map ctrl+shift+[ previous_window


cursor_shape underline
shell_integration no-cursor

cursor_trail 0
cursor_trail_decay 0.1 0.4


window_padding_width 0 4 0 4
tab_bar_margin_width 0
tab_bar_margin_height 2 0

# tabs


map ctrl+shift+t     new_tab
map ctrl+shift+w     close_tab
map ctrl+shift+l     next_tab
map ctrl+shift+h     previous_tab
map ctrl+shift+enter launch --location=hsplit
map ctrl+shift+e     launch --cwd=current --type=overlay fish -c "ranger"
# map ctrl+shift+n     launch --cwd=current --type=overlay fish -c "nvim"

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

tab_separator ""
tab_title_template " [{index}: {tab.active_exe}]"
inactive_tab_font_style normal
active_tab_font_style normal

tab_bar_style separator
tab_bar_align left
tab_bar_edge top

tab_bar_background #000000
active_tab_foreground   #cccccc
active_tab_background   #000000
inactive_tab_foreground #888888
inactive_tab_background #000000
